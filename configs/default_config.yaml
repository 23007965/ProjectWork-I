# Default configuration for marine biodiversity prediction project

project:
  name: "marine-biodiversity-prediction"
  random_seed: 42
  n_seeds: 5  # Number of random seeds for reproducibility

study_region:
  name: "North Sea"  # Will be updated based on Phase 3 findings
  lat_min: 51.0
  lat_max: 62.0
  lon_min: -4.0
  lon_max: 10.0
  spatial_resolution_deg: 0.25
  temporal_resolution: "monthly"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"

  oceanographic:
    variables:
      - "sea_surface_temperature"
      - "dissolved_oxygen"
      - "salinity"
      - "chlorophyll_a"
    temporal_aggregation: "monthly_mean"

  fisheries:
    variables:
      - "fishing_hours"
      - "vessel_count"
    temporal_aggregation: "monthly_sum"

  edna:
    min_samples_per_location: 2
    taxonomic_level: "species"
    target_group: "Actinopterygii"  # Ray-finned fishes

prediction:
  target: "future_fish_species_richness"
  history_window_months: 6
  prediction_horizon_months: 6
  min_species_detections: 1

splits:
  method: "chronological"
  train_fraction: 0.6
  val_fraction: 0.2
  test_fraction: 0.2

models:
  baselines:
    xgboost:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
    catboost:
      iterations: 200
      depth: 6
      learning_rate: 0.1
    mlp:
      hidden_sizes: [128, 64, 32]
      dropout: 0.2
      lr: 0.001
      epochs: 100
      batch_size: 32

  cross_modal_attention:
    encoder_dim: 64
    attention_heads: 4
    attention_dim: 64
    dropout: 0.2
    lr: 0.001
    epochs: 150
    batch_size: 32
    missing_modality_mask: true

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "r2"
  confidence_level: 0.95
  statistical_test: "wilcoxon"
